name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# rustup on the runner installs the toolchain from rust-toolchain.toml.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make lint
      - run: make lint-ci
      - run: scripts/test-changelog-section.sh
      - run: scripts/test-changelog-assemble.sh
      - run: scripts/changelog-assemble.sh --check
      - run: scripts/test-release.sh

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - run: make test
      - run: make test-docker
      - name: Test Linux inbound TCP predictions
        run: |
          if ! command -v nft >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y nftables
          fi
          sudo scripts/test-inbound-path.sh target/debug/reachmap
      - name: Test Docker bridge published-port predictions
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --target x86_64-unknown-linux-musl
          scripts/test-docker-path.sh target/x86_64-unknown-linux-musl/debug/reachmap
      - run: make msrv

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make build
      - run: make check-macos

  # Not a required check: macOS runners can take many minutes to start, which
  # must not hold up a merge. `build` still type-checks the macOS code.
  macos:
    name: macos
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make build
      - run: cargo test --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: make deny
