name: release

# A vX.Y.Z tag publishes a release. A pull request that changes this workflow
# or its scripts rehearses it: same builds, nothing published. Tags cannot be
# moved, so this is the only chance to catch a mistake before a real release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/check-release.sh
      - scripts/package-release.sh
      - scripts/render-formula.sh

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# No rust-cache here: a release is built from a clean slate. rustup on the
# runner installs the toolchain from rust-toolchain.toml.
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The tag is compared with the history of main.
          persist-credentials: false
      - id: version
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
              version=$(scripts/check-release.sh "$GITHUB_REF_NAME")
          else
              version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - run: cargo publish --dry-run --locked

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-26-intel }
          - { target: aarch64-apple-darwin, runner: macos-26 }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Run the binary
        run: |
          binary="target/$TARGET/release/reachmap"
          test "$("$binary" --version)" = "reachmap $VERSION"
      - name: Run a scan and check static linking
        if: runner.os == 'Linux'
        run: |
          binary="target/$TARGET/release/reachmap"
          file "$binary" | grep -E 'static(ally|-pie) linked'
          # Exit status 1 means the scan ran and printed warnings.
          status=0
          "$binary" scan || status=$?
          test "$status" -le 1
      - run: scripts/package-release.sh "$VERSION" "$TARGET" "target/$TARGET/release/reachmap" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: github-release
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: cd dist && shasum -a 256 -c ./*.sha256
      - run: scripts/changelog-section.sh "$VERSION" >release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
              gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
                  --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi

  crates-io:
    name: crates-io
    if: github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew-tap:
    name: homebrew-tap
    if: github.event_name == 'push'
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: |
          cat dist/*.sha256 >checksums.txt
          scripts/render-formula.sh "$VERSION" checksums.txt >reachmap.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MHusted01/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Open the formula pull request
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          branch="reachmap-$VERSION"
          git switch -c "$branch"
          mkdir -p Formula
          cp ../reachmap.rb Formula/reachmap.rb
          git add Formula/reachmap.rb
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "reachmap $VERSION"
          # The branch belongs to this release, so a re-run may replace it.
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
              gh pr create --head "$branch" --title "reachmap $VERSION" \
                  --body "Formula for reachmap $VERSION."
          fi
