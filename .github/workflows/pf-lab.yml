name: pf-lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pf-lab:
    name: pf-lab
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build reachmap
        run: cargo build --locked
      - name: Verify pf verdicts against real macOS pf
        run: scripts/test-pf.sh target/debug/reachmap
