name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and this has not been suggested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to find out about your host, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should reachmap behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you considered.
  - type: markdown
    attributes:
      value: |
        reachmap is read-only: it reports exposure but never changes firewall rules,
        containers or system settings.
