[package]
name = "reachmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shows which services on a host can be reached, from where, and why"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MHusted01/reachmap"
readme = "README.md"
keywords = ["network", "security", "docker", "firewall", "homelab"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", "scripts/"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["net"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
