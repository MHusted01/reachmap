# configuration file /etc/nginx/nginx.conf:
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

# configuration file /etc/nginx/mime.types:
types {
    text/html html htm;
    application/json json;
}

# configuration file /etc/nginx/conf.d/upstreams.conf:
upstream api_backend {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server [::1]:3001 backup;
    server 10.20.30.40:8080 down;
    keepalive 16;
}

# configuration file /etc/nginx/sites-enabled/default.conf:
server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;
    server_name app.example.test *.example.test demo.* _;

    ssl_verify_client optional;

    location = /healthz {
        proxy_pass http://127.0.0.1:9000/health;
    }

    location ^~ /api/ {
        auth_basic "Restricted API";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass https://api_backend;
    }

    location / {
        proxy_pass http://localhost:4000;
    }
}

server {
    listen 443 ssl http2;
    listen 192.0.2.10:8443 ssl;
    server_name .internal.example.test;

    auth_basic "Admin";

    location /public/ {
        auth_basic off;
        proxy_pass http://198.51.100.25:8080/public/;
    }
}
