# configuration file /etc/nginx/sites-enabled/SENTINEL_FILE_NAME_OK.conf:
# SENTINEL_COMMENT_SECRET_VALUE
http {
    server {
        listen 443 ssl;
        server_name app.example.test;

        ssl_certificate /etc/ssl/certs/SENTINEL_CERT_PATH.pem;
        ssl_certificate_key /etc/ssl/private/SENTINEL_PRIVATE_KEY_PATH.key;
        ssl_password_file /etc/nginx/SENTINEL_SSL_PASSWORD_FILE;

        auth_basic "SENTINEL_AUTH_REALM_SECRET";
        auth_basic_user_file /etc/nginx/SENTINEL_HTPASSWD_FILE;

        proxy_set_header Authorization "Bearer SENTINEL_BEARER_TOKEN";
        add_header X-Internal-Secret "SENTINEL_HEADER_SECRET";

        location /app {
            proxy_pass https://SENTINEL_USER:SENTINEL_PASS@127.0.0.1:8443/v1/items?token=SENTINEL_QUERY_TOKEN#SENTINEL_FRAGMENT;
        }

        location /body {
            return 200 "SENTINEL_RETURN_BODY_SECRET";
        }
    }
}
