# configuration file /etc/nginx/nginx.conf:
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    geo $allowed_net {
        default 0;
        10.0.0.0/8 1;
    }

    server {
        listen 8080 proxy_protocol;
        server_name ~^api-(?<env>[a-z]+)\.example\.test$;

        try_files $uri @fallback;
        error_page 502 /502.html;

        location @fallback {
            proxy_pass http://127.0.0.1:9999;
        }

        location ~ ^/regex/.*$ {
            proxy_pass http://127.0.0.1:9001;
        }

        location /if-and-rewrite {
            if ($request_method = POST) {
                return 403 "blocked-raw-body";
            }
            rewrite ^/old/(.*)$ /new/$1 break;
            proxy_pass http://127.0.0.1:9002;
        }

        location /dynamic-target {
            proxy_pass http://$upstream_var:8080;
        }

        location /unix-proxy {
            proxy_pass http://unix:/run/app.sock:/;
        }

        location /fastcgi {
            fastcgi_pass 127.0.0.1:9000;
        }

        location /grpc {
            grpc_pass grpc://127.0.0.1:50051;
        }

        location /acl-and-auth-req {
            allow 10.0.0.0/8;
            deny all;
            auth_request /_auth;
            proxy_pass http://127.0.0.1:9003;
        }

        location /nested-outer {
            location /nested-inner {
                proxy_pass http://127.0.0.1:9004;
            }
            custom_third_party_module on;
            proxy_pass http://127.0.0.1:9005;
        }
    }
}

stream {
    server {
        listen 5432;
        proxy_pass 127.0.0.1:5432;
    }
}
