# cargo-deny: security advisories, licences, banned crates and sources.
# Run with `make deny`. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec advisories fail the check; unmaintained crates too.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences compatible with MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is ready for future dependencies; unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
